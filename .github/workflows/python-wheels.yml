name: Python wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-wheels:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.12
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            interpreter: python3.12
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            interpreter: python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            interpreter: python
          - os: macos-15
            target: aarch64-apple-darwin
            interpreter: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --interpreter ${{ matrix.interpreter }} --locked
            --manifest-path mirabox-n4pro-py/Cargo.toml --out dist
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && '--sdist' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mirabox-n4pro
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
