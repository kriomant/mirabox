[workspace]
members = ["mirabox", "python"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]

async-hid = { version = "0.5.3", default-features = false, features = ["tokio", "win32"] }
futures-lite = "2.6.1"
image = "0.25.10"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
